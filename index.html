function fitAppHeight(){try{document.documentElement.style.setProperty('--app-h',window.innerHeight+'px')}catch(e){}}

window.addEventListener('orientationchange',function(){setTimeout(fitAppHeight,200)});

<script>
var KEEP_KEYS = ['hermandad_tpv_user', 'hermandad_tpv_sync_url', 'hermandad_tpv_sync_pass', 'hermandad_tpv_orders_view'];
function cookieGet(k){try{var m=document.cookie.split('; ').find(function(c){return c.indexOf(k+'=')===0});return m?decodeURIComponent(m.slice(k.length+1)):null}catch(e){return null}}
function cookieSet(k,v){try{document.cookie=k+'='+encodeURIComponent(v)+'; max-age=31536000; path=/; SameSite=Lax'}catch(e){}}
function safeGet(k){var v=null;try{v=localStorage.getItem(k)}catch(e){}if((v===null||v===undefined)&&KEEP_KEYS.indexOf(k)>-1){v=cookieGet(k)}return v}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}if(KEEP_KEYS.indexOf(k)>-1){cookieSet(k,v)}}
try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist()}}catch(e){}
</script>
